services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: tunijobs_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-tunijobs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tunijobs_secret}
      POSTGRES_DB: ${DB_NAME:-tunijobs_db}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tunijobs} -d ${DB_NAME:-tunijobs_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tunijobs_redis_prod
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: tunijobs_minio_prod
    restart: always
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data_prod:/data

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: tunijobs_ai_prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: tunijobs_api_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://${DB_USER:-tunijobs}:${DB_PASSWORD:-tunijobs_secret}@postgres:5432/${DB_NAME:-tunijobs_db}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET:-tunijobs_secret_jwt_prod_2026}
      - NEXT_PUBLIC_APP_URL=http://localhost:3000

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: tunijobs_web_prod
    restart: always
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
      - NEXT_PUBLIC_APP_URL=http://localhost:3000

volumes:
  postgres_data_prod:
  redis_data_prod:
  minio_data_prod:
